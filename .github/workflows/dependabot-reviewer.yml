name: Dependabot Reviewer Router

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  route-reviewer:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Route Reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADMIN_TEAM_SLUG: "cloud-solutions-the-repo-admin"
        run: |
          echo "Processing Dependabot PR #${PR_NUMBER} on ${REPO}"

          # Fetch currently requested reviewers (users and teams)
          REVIEWERS_DATA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" || true)

          # Extract user logins to remove
          USER_REVIEWERS=$(echo "$REVIEWERS_DATA" | jq -c '[.users[].login] // []' 2>/dev/null || echo "[]")
          echo "Found user reviewers: $USER_REVIEWERS"

          # Batch remove auto-assigned user reviewers in a single API request
          if [ "$USER_REVIEWERS" != "[]" ] && [ -n "$USER_REVIEWERS" ]; then
            echo "Removing user reviewers: $USER_REVIEWERS"
            gh api --method DELETE "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              --input - <<< "{\"reviewers\": $USER_REVIEWERS}" || true
          fi

          # Extract other team reviewers to remove (excluding admin team)
          OTHER_TEAMS=$(echo "$REVIEWERS_DATA" | jq -c --arg admin "$ADMIN_TEAM_SLUG" '[.teams[].slug | select(. != $admin)] // []' 2>/dev/null || echo "[]")
          echo "Found non-admin team reviewers: $OTHER_TEAMS"

          # Batch remove other team reviewers in a single API request
          if [ "$OTHER_TEAMS" != "[]" ] && [ -n "$OTHER_TEAMS" ]; then
            echo "Removing non-admin team reviewers: $OTHER_TEAMS"
            gh api --method DELETE "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              --input - <<< "{\"team_reviewers\": $OTHER_TEAMS}" || true
          fi

          # Add the admin team as reviewer
          echo "Adding admin team as reviewer: $ADMIN_TEAM_SLUG"
          gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            --input - <<< "{\"team_reviewers\": [\"$ADMIN_TEAM_SLUG\"]}"
