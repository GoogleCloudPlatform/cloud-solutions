openapi: 3.0.0
info:
  title: Oracle EBS Autonomous Assistant API
  description: Unified Gateway API for Oracle EBS Inventory, Financials, and Supplier Negotiation workers.
  version: 1.0.0
servers:
  - url: https://a2a-server-PROJECT_ID.REGION.run.app
    description: Live A2A Gateway Server on Google Cloud Run
paths:
  /check-stock:
    post:
      summary: Check warehouse stock levels
      description: Queries the live Oracle EBS database for item stock level and checks if it falls below the reorder threshold.
      operationId: check_stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_code
              properties:
                item_code:
                  type: string
                  description: The unique item code segment (e.g., AS54888) in MTL_SYSTEM_ITEMS_B.
      responses:
        "200":
          description: Stock status successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_id:
                    type: integer
                  item_code:
                    type: string
                  description:
                    type: string
                  stock_level:
                    type: integer
                  reorder_threshold:
                    type: integer
                  status:
                    type: string

  /invoice-status:
    post:
      summary: Query accounts payable invoice status
      description: Returns the payment status and cash flow allowance status of a given EBS invoice.
      operationId: invoice_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_num
              properties:
                invoice_num:
                  type: string
                  description: The invoice number in AP_INVOICES_ALL.
      responses:
        "200":
          description: Invoice details and DSO status retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice_id:
                    type: integer
                  invoice_num:
                    type: string
                  amount:
                    type: number
                  status:
                    type: string
                  dso_metric:
                    type: number
                  cash_flow_allowance:
                    type: string

  /negotiate:
    post:
      summary: Negotiate external vendor quotes
      description: Initiates dynamic restock negotiation with mock external vendor catalogs for pricing and delivery options.
      operationId: negotiate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_code
                - quantity
              properties:
                item_code:
                  type: string
                  description: Item code to restock.
                quantity:
                  type: integer
                  description: Total quantity to negotiate purchase orders for.
      responses:
        "200":
          description: Procurement purchase quote generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendor:
                    type: string
                  item_code:
                    type: string
                  quantity:
                    type: integer
                  unit_price:
                    type: number
                  total_estimated_cost:
                    type: number
                  delivery_timeline:
                    type: string
                  status:
                    type: string

  /agents/discover:
    get:
      summary: Discover active workers
      description: Queries the A2A server to discover registered active worker agent endpoints dynamically.
      operationId: discover_agents
      responses:
        "200":
          description: Successfully discovered matching agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway:
                    type: string

  /organizations:
    post:
      summary: List inventory warehouse operating organizations
      description: Queries active Oracle EBS inventory operating organizations from ORG_ORGANIZATION_DEFINITIONS. Returns the complete list of organizations including organization_id, organization_code, and organization_name.
      operationId: list_organizations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 50
                  description: Max number of organizations to return (1-100).
      responses:
        "200":
          description: Organizations list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  total_found:
                    type: integer
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        organization_id:
                          type: integer
                        organization_code:
                          type: string
                        organization_name:
                          type: string

  /items:
    post:
      summary: List inventory items for an organization
      description: Queries the inventory items catalog from MTL_SYSTEM_ITEMS_B and MTL_ONHAND_QUANTITIES_DETAIL for a specific organization.
      operationId: list_items
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type: integer
                  description: Organization ID (e.g. 204).
                organization_code:
                  type: string
                  description: Organization Code (e.g. V1).
                limit:
                  type: integer
                  default: 50
                  description: Max number of items to return (1-100).
      responses:
        "200":
          description: Item catalog retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  organization_id:
                    type: integer
                  total_found:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        inventory_item_id:
                          type: integer
                        item_code:
                          type: string
                        description:
                          type: string
                        organization_id:
                          type: integer
                        total_on_hand:
                          type: number

  /suppliers:
    post:
      summary: List approved suppliers
      description: Queries the master vendor catalog from AP_SUPPLIERS.
      operationId: list_suppliers
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  default: 50
      responses:
        "200":
          description: Suppliers list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  total_found:
                    type: integer
                  suppliers:
                    type: array
                    items:
                      type: object
                      properties:
                        supplier_id:
                          type: integer
                        supplier_name:
                          type: string

  /item-suppliers:
    post:
      summary: List approved suppliers for a specific item
      description: Queries approved suppliers, unit pricing, and lead times for an inventory item.
      operationId: list_item_suppliers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_code
              properties:
                item_code:
                  type: string
                  description: Inventory item code (e.g. AS54888).
      responses:
        "200":
          description: Item suppliers retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_code:
                    type: string
                  total_suppliers:
                    type: integer
                  suppliers:
                    type: array
                    items:
                      type: object
                      properties:
                        supplier_id:
                          type: integer
                        supplier_name:
                          type: string
                        unit_price:
                          type: number
                        lead_time_days:
                          type: integer

  /supplier-items:
    post:
      summary: List items supplied by a vendor
      description: Queries Oracle EBS purchase orders and inventory items to list all items supplied by a specific vendor.
      operationId: list_supplier_items
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_id:
                  type: integer
                  description: Oracle EBS supplier or vendor ID (e.g. 515).
                supplier_name:
                  type: string
                  description: Oracle EBS supplier or vendor name.
                limit:
                  type: integer
                  default: 50
                  description: Max items to retrieve (1-100).
      responses:
        "200":
          description: Supplier items retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplier_id:
                    type: integer
                  supplier_name:
                    type: string
                  total_items:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        inventory_item_id:
                          type: integer
                        item_code:
                          type: string
                        description:
                          type: string
                        unit_price:
                          type: number
                        organization_id:
                          type: integer
                        po_number:
                          type: string
                  status:
                    type: string
                  notes:
                    type: string

  /calculate-dso:
    post:
      summary: Calculate Days Sales Outstanding (DSO)
      description: Computes DSO ratio and liquidity risk from total receivables and credit sales.
      operationId: calculate_dso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period_days:
                  type: integer
                  default: 90
                total_accounts_receivable:
                  type: number
                total_credit_sales:
                  type: number
      responses:
        "200":
          description: DSO calculation retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dso:
                    type: number
                  evaluation:
                    type: string
                  status:
                    type: string
