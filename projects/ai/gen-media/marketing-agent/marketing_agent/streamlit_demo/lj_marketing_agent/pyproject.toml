[project]
name = "lj_marketing_agent"
version = "5.20260410.1"
description = "Combined Marketing Campaign Agent - Image Ads and Video Ads"
authors = [{ name = "Layolin Jesudhass" }]
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "google-adk==1.36.2",
    "google-cloud-aiplatform[adk,agent-engines]==1.163.0",
    "google-cloud-bigquery==3.42.2",
    "google-genai==2.16.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "absl-py==2.5.0",
    "python-dotenv==1.2.2",
    "pandas==3.0.5",
    "toolbox-core==1.3.0",
    "google-cloud-texttospeech==2.37.0",
    "soundfile==0.14.0",
    "aiohttp==3.14.3",
    "requests==2.34.2",
    "Pillow==12.3.0",
    "lxml==6.1.1",
    "httpx==0.28.1",
    "google-cloud-storage==3.13.0",
    "tenacity==9.1.4",
    "google-ads==31.2.0",
    "rapidfuzz==3.14.5",
    "gitpython==3.1.58",
    "cryptography==50.0.0",
]

[tool.uv]
override-dependencies = [
    "pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lj_marketing_agent"]
