[project]
name = "adk_common"
version = "3.20251118.1"
description = "Common utilities for Tahoe agents"
authors = [{ name = "GenMedia Team", email = "team@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==1.36.2",
    "python-dotenv==1.2.2",
    "google-genai==2.16.0",
    "google-cloud-aiplatform[adk,agent-engines]==1.163.0",
    "pydantic==2.13.4",
    "absl-py==2.5.0",
    "requests==2.34.2",
    "google-cloud-storage==3.13.0",
    "tenacity==9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adk_common"]
