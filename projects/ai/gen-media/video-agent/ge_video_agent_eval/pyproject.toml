[project]
name = "ge_video"
version = "1.0.0"
description = "Multi-scene Video Ads Agent for Agent Engine — Omni/Veo + TTS + Lyria pipeline"
requires-python = "==3.13.*"
dependencies = [
    "google-adk==2.5.0",
    "google-cloud-aiplatform[adk,agent-engines]==1.163.0",
    "google-genai==2.14.0",
    "google-cloud-texttospeech==2.37.0",
    "google-cloud-storage==3.13.0",
    "pydantic==2.13.4",
    "Pillow==12.3.0",
    "python-dotenv==1.2.2",
    "absl-py==2.5.0",
    "requests==2.34.2",
    "tenacity==9.1.4",
    "matplotlib==3.10.8",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ge_video*"]
