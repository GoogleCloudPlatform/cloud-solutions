[project]
name = "video_ads_agent"
version = "1.0.0"
description = "Multi-scene Video Ads Agent — Omni + TTS + Lyria pipeline"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.5.0",
    "google-genai==2.14.0",
    "google-cloud-texttospeech==2.37.0",
    "streamlit==1.60.0",
    "Pillow==12.3.0",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_ads_agent*"]
