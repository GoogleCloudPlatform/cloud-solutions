sources:
  mysql-primary:
    kind: mysql
    host: ${DB_PRIMARY_HOST}
    port: "3306"
    database: ${DB_NAME}
    user: ${DB_AUDITOR_USER}
    password: ${DB_AUDITOR_PASSWORD}
    queryTimeout: 20s

  mysql-replica:
    kind: mysql
    host: ${DB_REPLICA_HOST}
    port: "3306"
    database: ${DB_NAME}
    user: ${DB_AUDITOR_USER}
    password: ${DB_AUDITOR_PASSWORD}
    queryTimeout: 20s

tools:
  list_primary_tables:
    kind: mysql-list-tables
    source: mysql-primary
    description: Lists tables, columns, and index definitions in the primary database.

  execute_primary_readonly_sql:
    kind: mysql-execute-sql
    source: mysql-primary
    description: Executes read-only SQL diagnostics against the primary instance.

  execute_replica_readonly_sql:
    kind: mysql-execute-sql
    source: mysql-replica
    description: Executes read-only SQL diagnostics against the read replica.

toolsets:
  waf_mysql_diagnostics:
    - list_primary_tables
    - execute_primary_readonly_sql
    - execute_replica_readonly_sql
