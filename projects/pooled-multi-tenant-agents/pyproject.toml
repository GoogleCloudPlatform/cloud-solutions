[project]
name = "cymbal-multitenant-pooled-agents"
version = "0.2.2"
description = "Reference implementation for Pattern A (High-Density Pooled Architecture) multi-tenant agentic AI on Google Cloud with Gemini and Agent Development Kit (ADK)"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "google-adk[otel-gcp]>=2.8.0",
    "google-cloud-aiplatform>=2.7.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-dlp>=3.20.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-modelarmor>=0.7.1",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-trace>=1.14.0",
    "google-crc32c>=1.5.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "redis>=5.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast hermetic unit, schema, config, and architecture contract tests",
    "security: hermetic cross-tenant isolation, cryptographic, DPoP, RLS, and sandbox breach tests",
    "integration: opt-in live GCP, KMS, Credential Broker, and Vertex AI integration tests",
    "live_gcp: opt-in live GCP and Vertex AI integration tests gated by RUN_LIVE_GCP_TESTS=1",
]

[tool.coverage.run]
source = ["agents", "mcp_server", "app", "broker_service", "runtime_service"]
omit = [
    "*/tests/*",
    "*/gcp_live_bridge.py",
    "*/agents/adapters/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "G", "PIE"]

[tool.ruff.lint.isort]
force-single-line = false
single-line-exclusions = ["typing", "collections.abc"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"app/ui/*.py" = ["E501", "RUF001"]
"app/tuesday_walkthrough_page.py" = ["E501", "RUF001"]
"scripts/render_3b1b_video.py" = ["E501", "RUF001"]
"scripts/render_e2e_life_of_request_diagram.py" = ["E501", "RUF001"]
"scripts/benchmark_pooling_at_scale.py" = ["E402", "E501"]
# Standalone CLI scripts bootstrap sys.path / offline signer before local package imports.
"scripts/*.py" = ["E402"]
