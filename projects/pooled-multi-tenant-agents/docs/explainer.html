<head>

  <title>Guided Architecture Story — Pooled Multi-Tenant AI Agents on Google Cloud</title>

    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --blue: #A8C7FA; --onblue: #062E6F;
      --on: #E3E3E3; --onv: #C4C7C5; --muted: #A8ABAE;
      --surf: #2A2B2E; --tonal: #373C4B; --ontonal: #D3E3FD;
      --sel: #35468A; --selb: #A8C7FA;
      --canvas: #0C0C0D; --page: #1B1B1C;
      --green: #6DD58C; --ongreen: #0A3818;
      --yellow: #FDD663; --onyellow: #3E2E00;
      --red: #F2B8B5; --onred: #601410;
      --purple: #D7AEFB; --onpurple: #42126B;

      --font-display: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      color: var(--on);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: absolute;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: var(--canvas);
      -webkit-user-select: text;
      user-select: text;
    }

    #prev, #next, #dock, #tools, #hud {
      -webkit-user-select: none;
      user-select: none;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .24s ease-out, visibility .24s;
    }
    .slide.in { opacity: 1; visibility: visible; pointer-events: auto; }
    .slide.out { opacity: 0; visibility: hidden; transition: opacity .14s ease-in, visibility .14s; }
    body.nomotion .slide { transition: none !important; }

    .abs { position: absolute; }
    .num { font-variant-numeric: proportional-nums; }
    td .num, .tab-num { font-variant-numeric: tabular-nums; }
    .sep { display: inline-block; margin: 0 10px; opacity: .45; }
    .w {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      padding-bottom: .14em;
      margin-bottom: -.14em;
    }
    .w > * { display: inline-block; }
    .w > i { font-style: normal; }

    #hud {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 32;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(27, 27, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 5px 8px;
      backdrop-filter: blur(10px);
    }
    .hud-pill {
      height: 30px;
      padding: 0 13px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 12px/1 var(--font-sans);
      color: var(--onv);
      text-decoration: none;
      transition: background .16s ease, color .16s ease;
    }
    .hud-pill:hover { background: var(--surf); color: var(--on); }
    .hud-pill.active { background: var(--blue); color: var(--onblue); }
    #slideCounter {
      padding: 0 10px;
      font: 500 12px/1 var(--font-mono);
      color: var(--muted);
    }

    #dock:not(.open) { visibility: hidden; }
    #dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 148px;
      background: rgba(18, 18, 20, .94);
      border-top: 1px solid rgba(255, 255, 255, .1);
      transform: translateY(100%);
      transition: transform .36s cubic-bezier(.2, .9, .25, 1), visibility .36s;
      z-index: 30;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    #dock.open { transform: translateY(0); }
    #track { display: flex; gap: 14px; transition: transform .36s cubic-bezier(.2, .9, .25, 1); }
    .thumb {
      width: 192px;
      height: 108px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, .12);
      background: var(--page);
      color: inherit;
      font: inherit;
      text-align: left;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      flex: none;
    }
    .thumb.cur { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(168, 199, 250, .25); }
    .thumb .tin {
      width: 1600px;
      height: 900px;
      transform: scale(.12);
      transform-origin: 0 0;
      position: relative;
      pointer-events: none;
    }

    #tools {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      padding: 10px 18px 16px;
      display: flex;
      gap: 8px;
      z-index: 31;
      opacity: .72;
      transition: opacity .2s, bottom .36s cubic-bezier(.2, .9, .25, 1);
    }
    #tools:hover, #tools:focus-within, #tools.up { opacity: 1; }
    #tools.up { bottom: 144px; }
    #tools button, #tools a {
      height: 36px;
      padding: 0 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: var(--surf);
      color: var(--on);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font: 500 13px/1 var(--font-sans);
      text-decoration: none;
      cursor: pointer;
    }
    #tools button.on { background: var(--blue); color: var(--onblue); border-color: transparent; }

    #prev, #next {
      width: 46px;
      height: 46px;
      top: 427px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 23px;
      background: rgba(27, 27, 28, .65);
      color: var(--onv);
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: .55;
      transition: opacity .2s, background .2s;
      z-index: 20;
    }
    #prev { left: 18px; }
    #next { right: 18px; }
    #prev:hover, #prev:focus-visible, #next:hover, #next:focus-visible {
      opacity: 1;
      background: var(--surf);
    }
    #prev:focus-visible, #next:focus-visible, #tools button:focus-visible, .thumb:focus-visible, a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .eb-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 16px;
      border-radius: 17px;
      background: var(--surf);
      color: var(--onv);
      font: 500 15px/1 var(--font-sans);
    }
    .eb-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
    }

    .h1-title {
      left: 96px;
      top: 120px;
      width: 1408px;
      font: 600 52px/1.10 var(--font-display);
      letter-spacing: -0.022em;
      color: var(--on);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 28px;
      border-radius: 26px;
      background: var(--blue);
      color: var(--onblue);
      font: 600 18px/1 var(--font-display);
      text-decoration: none;
      cursor: pointer;
    }
    .btn-primary.shape-backed { background: transparent; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 24px;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: rgba(42, 43, 46, .75);
      color: var(--on);
      font: 600 17px/1 var(--font-display);
      text-decoration: none;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--surf); }

    .chip-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border-radius: 19px;
      background: var(--page);
      border: 1px solid rgba(255, 255, 255, .09);
      color: var(--onv);
      font: 500 15px/1 var(--font-sans);
      text-decoration: none;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .chip-jump:hover { background: var(--surf); color: var(--on); }

    .card-page { border-radius: 28px; background: var(--page); padding: 32px 36px; }
    .card-surf { border-radius: 28px; background: var(--surf); padding: 32px 36px; }
    .shape-host { background: transparent; border: 0; box-shadow: none; }

    .badge-tonal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border-radius: 16px;
      font: 600 14px/1 var(--font-display);
      white-space: nowrap;
      text-decoration: none;
    }
    .b-blue   { background: var(--tonal);  color: var(--ontonal); }
    .b-green  { background: var(--green);  color: var(--ongreen); }
    .b-yellow { background: var(--yellow); color: var(--onyellow); }
    .b-red    { background: var(--red);    color: var(--onred); }
    .b-purple { background: var(--purple); color: var(--onpurple); }
    .b-surf   { background: var(--surf);   color: var(--onv); }

    .mono-inline { font-family: var(--font-mono); font-size: 0.9em; color: var(--ontonal); }
    .code-slab {
      border-radius: 18px;
      background: #121418;
      border: 1px solid rgba(255, 255, 255, .08);
      padding: 18px 22px;
      font: 400 15.5px/1.55 var(--font-mono);
      color: var(--on);
      white-space: pre-wrap;
    }

    .plat-row {
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .plat-row:last-child { border-bottom: 0; }
    .plat-row.on {
      border-radius: 14px;
      background: var(--sel);
      border: 1.5px solid var(--selb);
    }

    .data-tbl { width: 100%; border-collapse: collapse; text-align: left; }
    .data-tbl th {
      padding: 0 22px 14px 0;
      font: 500 15px/1.2 var(--font-sans);
      color: var(--muted);
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }
    .data-tbl th:last-child, .data-tbl td:last-child { padding-right: 0; }
    .data-tbl td {
      padding: 16px 22px 16px 0;
      font: 400 18px/1.38 var(--font-sans);
      color: var(--onv);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      vertical-align: middle;
    }
    .data-tbl tr:last-child td { border-bottom: 0; padding-bottom: 4px; }
    .data-tbl td strong { color: var(--on); font-weight: 600; }

    .step-idx {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 17px;
      background: var(--tonal);
      color: var(--ontonal);
      font: 600 16px/1 var(--font-display);
      flex: none;
    }

    .src-note {
      left: 96px;
      top: 786px;
      width: 1408px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font: 400 15px/1.3 var(--font-sans);
      color: var(--muted);
    }
    .src-link {
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
    }
    .src-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header id="hud" aria-label="Experience mode">
    <a class="hud-pill active" href="explainer.html?slide=1" aria-current="page">Guided Story Deck</a>

    <span id="slideCounter">1 / 13</span>
  </header>

  <div id="stage">
    <div id="slides"></div>
    <button id="prev" type="button" aria-label="Previous slide" class="abs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

      <span>Open Security Lab ↗</span>
    </a>
  </div>

  <script>
    (function () {
      "use strict";

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            const v = attrs[k];
            if (v === null || v === undefined) return;
            if (k === "className") node.className = v;
            else if (k === "textContent") node.textContent = v;
            else if (k === "style") node.setAttribute("style", v);
            else if (k === "dataset") {
              Object.keys(v).forEach(function (dk) {
                node.dataset[dk] = String(v[dk]);
              });
            } else {
              node.setAttribute(k, String(v));
            }
          });
        }
        appendKids(node, children);
        return node;
      }

      function svgEl(tag, attrs, children) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            if (attrs[k] !== null && attrs[k] !== undefined) {
              node.setAttribute(k, String(attrs[k]));
            }
          });
        }
        appendKids(node, children);
        return node;
      }

      function appendKids(parent, children) {
        if (!children) return;
        children.forEach(function (ch) {
          if (ch === null || ch === undefined || ch === false) return;
          if (typeof ch === "string" || typeof ch === "number") {
            parent.appendChild(document.createTextNode(String(ch)));
          } else if (Array.isArray(ch)) {
            appendKids(parent, ch);
          } else {
            parent.appendChild(ch);
          }
        });
      }

      function eb(cat, sub, dotColor, delayMs) {
        return el(
          "div",
          {
            className: "abs eb-pill",
            style: "left:96px;top:68px",
            dataset: { a: "up", d: delayMs || 20 }
          },
          [
            el("span", { className: "eb-dot", style: "background:" + (dotColor || "var(--blue)") }),
            el("span", null, [cat]),
            el("span", { className: "sep" }, ["·"]),
            el("span", null, [sub])
          ]
        );
      }

      function h1(plainPrefix, accentText, accentColor, plainSuffix, delayMs) {
        return el(
          "div",
          {
            className: "abs h1-title",
            dataset: { a: "words", d: delayMs || 100 }
          },
          [
            plainPrefix,
            el("span", { className: "acc", style: "color:" + (accentColor || "var(--blue)") }, [accentText]),
            plainSuffix || ""
          ]
        );
      }

      function srcFooter(text, labHref, labLabel, delayMs) {
        return el(
          "div",
          { className: "abs src-note", dataset: { a: "fade", d: delayMs || 540 } },
          [
            el("span", null, ["Source: " + text]),
            labHref
              ? el("a", { className: "src-link", href: labHref }, [labLabel + " →"])
              : null
          ]
        );
      }

      function secCover(cat, sub, titleText, bgShape, bgColor, dotColor) {
        return {
          shape: null,
          bg: { s: bgShape, cx: 1180, cy: 460, R: 440, rot: 0.08, c: bgColor, o: 0.86 },
          build: function () {
            return [
              eb(cat, sub, dotColor, 40),
              el(
                "div",
                {
                  className: "abs",
                  style: "left:96px;top:520px;width:1160px;font:600 104px/1.02 var(--font-display);letter-spacing:-0.028em;color:var(--on)",
                  dataset: { a: "words", d: 140 }
                },
                [titleText]
              )
            ];
          }
        };
      }

      function codeLine(keyText, valText, valColor) {
        return el("div", null, [
          keyText ? el("span", { style: "color:var(--blue)" }, [keyText]) : null,
          valColor ? el("span", { style: "color:" + valColor }, [valText]) : valText
        ]);
      }

      const COL = {
        blue: [168, 199, 250],
        green: [109, 213, 140],
        yellow: [253, 214, 99],
        red: [242, 184, 181],
        purple: [215, 174, 251],
        surf: [42, 43, 46],
        tonal: [55, 60, 75],
        page: [27, 27, 28],
        sel: [53, 70, 138]
      };

      const BGC = {
        blue: [27, 95, 217],
        green: [24, 128, 70],
        yellow: [176, 128, 0],
        red: [190, 45, 40],
        purple: [128, 64, 200]
      };

      const COVER_BG = { s: "clover",   cx: 1230, cy: 490, R: 445, rot: 0.06,  c: "blue",   o: 0.88 };
      const ID_BG    = { s: "circle",   cx: 1490, cy: 840, R: 245, rot: 0.20,  c: "blue",   o: 0.52 };
      const COMP_BG  = { s: "pentagon", cx: 1500, cy:  95, R: 200, rot: 0.22,  c: "purple", o: 0.52 };
      const DATA_BG  = { s: "clover",   cx: 1500, cy: 845, R: 230, rot: -0.18, c: "green",  o: 0.50 };
      const CAND_BG  = { s: "flower",   cx:  110, cy: 865, R: 245, rot: -0.15, c: "yellow", o: 0.48 };

      const S = [];

      /* SLIDE 1: PRESENTATION COVER */
      S.push({
        shape: { sel: ".s1-cta", r: 26, c: "blue" },
        bg: COVER_BG,
        build: function () {
          return [
            eb("Cloud Architecture Blueprint · Part 2", "Pooled Multi-Tenant AI Agents", "var(--blue)", 20),
            el(
              "div",
              {
                className: "abs",
                style: "left:96px;top:174px;width:980px;font:600 84px/1.03 var(--font-display);letter-spacing:-0.028em;color:var(--on)",
                dataset: { a: "words", d: 90 }
              },
              [
                "Pooled AI Agents ",
                el("span", { className: "acc", style: "color:var(--blue)" }, ["without Shared Blast Radius"])
              ]
            ),
            el(
              "div",
              {
                className: "abs",
                style: "left:96px;top:398px;width:820px;font:400 24px/1.44 var(--font-sans);color:var(--onv)",
                dataset: { a: "up", d: 260 }
              },
              ["How SaaS providers isolate enterprise tenant data, OAuth credentials, untrusted code execution, and long-term memory on shared Google Cloud infrastructure."]
            ),
            el(
              "div",
              { className: "abs", style: "left:96px;top:548px;display:flex;align-items:center;gap:16px" },
              [
                el("a", { href: "?slide=2", className: "btn-primary shape-backed s1-cta", dataset: { go: 1 } }, [
                  el("span", { dataset: { a: "fade", d: 340 }, style: "display:inline-flex;align-items:center;gap:10px;color:var(--onblue)" }, [
                    "Start Guided Walkthrough →"
                  ])
                ]),
                el("a", { href: "visualizer.html?tab=flow", className: "btn-secondary", dataset: { a: "up", d: 380 } }, [
                  "Open Hands-On Security Lab ↗"
                ])
              ]
            ),
            el(
              "div",
              { className: "abs", style: "left:96px;top:680px;display:flex;align-items:center;gap:12px", dataset: { a: "up", d: 450 } },
              [
                el("span", { style: "font:500 15px/1 var(--font-sans);color:var(--muted);margin-right:4px" }, ["Jump to"]),
                el("a", { href: "?slide=2", className: "chip-jump", dataset: { go: 1 } }, ["Why prototypes break"]),
                el("a", { href: "?slide=5", className: "chip-jump", dataset: { go: 4 } }, ["Identity & Vault"]),
                el("a", { href: "?slide=8", className: "chip-jump", dataset: { go: 7 } }, ["Brain & gVisor Hands"]),
                el("a", { href: "?slide=11", className: "chip-jump", dataset: { go: 10 } }, ["Memory & Data Locks"]),
                el("a", { href: "?slide=13", className: "chip-jump", dataset: { go: 12 } }, ["Candor & Graduation"])
              ]
            ),
            srcFooter("Apache-2.0 Reference Stack · GoogleCloudPlatform/cloud-solutions/projects/pooled-multi-tenant-agents", "visualizer.html?tab=flow", "Inspect 6-Checkpoint Packet Tracer", 520)
          ];
        }
      });

      /* SLIDE 2: WHY SINGLE-CONTAINER AGENT PROTOTYPES BREAK */
      S.push({
        shape: { sel: ".s2-card", r: 28, c: "page" },
        bg: ID_BG,
        build: function () {
          return [
            eb("The Multi-Tenant Dilemma", "Why SaaS AI agents need new boundaries", "var(--blue)"),
            h1("Co-located agent prototypes turn ", "one confused turn into a cross-tenant breach", "var(--blue)"),

            o.s.set(1);
          }
          if (o.started && !o.done) {
            o.s.step2();
            applyAnim(o);
            if (o.s.isRest()) settleAnim(o);
          }
        });
        s.counts.forEach(function (c) {
          renderCount(c, noMotion ? 1 : (elapsedMs - c.d) / c.dur);
        });
      }

      function syncCarousel() {
        if (!track || !thumbs.length) return;
        thumbs.forEach(function (t, k) {
          const isCur = k === cur;
          t.classList.toggle("cur", isCur);
          if (isCur) t.setAttribute("aria-current", "step");
          else t.removeAttribute("aria-current");
        });
        track.style.transform =
          "translateX(" + (window.innerWidth / 2 - (cur * (TW + TG) + TW / 2)).toFixed(1) + "px)";
      }

      function toggleCarousel() {
        const open = dock.classList.toggle("open");
        const b = document.getElementById("tCar");
        const tools = document.getElementById("tools");
        b.classList.toggle("on", open);
        b.setAttribute("aria-expanded", String(open));
        tools.classList.toggle("up", open);
        dock.inert = !open;
        syncCarousel();
      }

      function setMotion(enableMotion) {
        noMotion = !enableMotion;
        document.body.classList.toggle("nomotion", noMotion);
        const b = document.getElementById("tMot");
        const lbl = document.getElementById("tMotLabel");
        b.classList.toggle("on", noMotion);
        b.setAttribute("aria-pressed", String(noMotion));
        lbl.textContent = noMotion ? "Motion: Off (M)" : "Motion: On (M)";
        if (noMotion && cur >= 0) {
          shapeToSlide(S[cur], true);
          shapeDraw();
          bgToSlide(S[cur], true);
          bgDraw();
          stepSlide(S[cur], 1e9);
        }
      }

      function readSlideIndex() {
        const raw = new URLSearchParams(window.location.search).get("slide");
        const n = parseInt(raw || "1", 10);
        return Number.isFinite(n) && n >= 1 ? clamp(n - 1, 0, S.length - 1) : 0;
      }

      function go(idx, opts) {
        const options = opts || {};
        const nextIdx = clamp(idx, 0, S.length - 1);
        if (nextIdx === cur && !options.force) return;
        const prevSlide = S[cur];
        if (prevSlide && prevSlide !== S[nextIdx]) {
          prevSlide.el.classList.remove("in");
          prevSlide.el.classList.add("out");
          setTimeout(function () {
            if (S[cur] !== prevSlide) {
              prevSlide.el.classList.remove("out");
              resetSlide(prevSlide);
            }
          }, 180);
        }
        cur = nextIdx;
        const s = S[nextIdx];
        resetSlide(s);
        s.el.classList.remove("out");
        void s.el.offsetWidth;
        s.el.classList.add("in");
        tEnter = performance.now();
        const snap = Boolean(options.snap || noMotion);
        shapeToSlide(s, snap);
        shapeDraw();
        bgToSlide(s, snap);
        bgDraw();
        if (noMotion) stepSlide(s, 1e9);

        document.getElementById("prev").hidden = nextIdx === 0;
        document.getElementById("next").hidden = nextIdx === S.length - 1;
        document.getElementById("slideCounter").textContent = (nextIdx + 1) + " / " + S.length;

        try {
          const u = new URL(window.location.href);
          u.searchParams.set("slide", String(nextIdx + 1));
          window.history.replaceState(null, "", u);
        } catch (_err) {
          /* Ignore file:// replaceState restriction */
        }
        syncCarousel();
      }

      let tPrev = 0;
      function frame(tm) {
        const dt = tPrev ? Math.min(0.05, (tm - tPrev) / 1000) : 1 / 60;
        tPrev = tm;
        steps = Math.max(1, Math.round(dt / DT));
        if (!noMotion) {
          shapeStep();
          shapeDraw();
          bgStep();
          bgDraw();
        }
        if (S[cur]) stepSlide(S[cur], noMotion ? 1e9 : tm - tEnter);
        window.requestAnimationFrame(frame);
      }

      function splitWords(wHost) {
        const d0 = Number(wHost.dataset.d) || 0;
        let k = 0;
        function wrapWord(node) {
          const w = el("span", { className: "w" });
          node.replaceWith(w);
          w.appendChild(node);
          node.dataset.a = "w";
          node.dataset.d = String(d0 + k++ * 48);
        }
        function walk(parent) {
          Array.from(parent.childNodes).forEach(function (n) {
            if (n.nodeType === 3) {
              const frag = document.createDocumentFragment();
              const created = [];
              (n.textContent || "").split(/(\s+)/).forEach(function (tok) {
                if (!tok) return;
                if (/^\s+$/.test(tok)) {
                  frag.appendChild(document.createTextNode(" "));
                } else {
                  const wordEl = el("i", { textContent: tok });
                  frag.appendChild(wordEl);
                  created.push(wordEl);
                }
              });
              n.replaceWith(frag);
              created.forEach(wrapWord);
            } else if (n.nodeType === 1 && n.tagName !== "BR") {
              if (n.classList.contains("acc")) wrapWord(n);
              else walk(n);
            }
          });
        }
        walk(wHost);
        wHost.removeAttribute("data-a");
      }

      function boot() {
        S.forEach(function (s, index) {
          const sec = el("section", { className: "slide", dataset: { idx: index } }, s.build());
          slidesHost.appendChild(sec);
          s.el = sec;
          s.anims = [];
          s.counts = [];

          Array.from(sec.querySelectorAll('[data-a="words"]')).forEach(splitWords);

          Array.from(sec.querySelectorAll("[data-count]")).forEach(function (cntEl) {
            s.counts.push({
              el: cntEl,
              txt: cntEl.textContent || "",
              d: Number(cntEl.dataset.d) || 0,
              dur: Number(cntEl.dataset.count) || 1000
            });
          });

          Array.from(sec.querySelectorAll("[data-a]")).forEach(function (animNode) {
            const type = animNode.dataset.a || "up";
            if (type === "bar") animNode.style.transformOrigin = "0 50%";
            s.anims.push({
              el: animNode,
              type: type,
              d: Number(animNode.dataset.d) || 0,
              s: new Spr(0, SPRINGS.snappy[0], SPRINGS.snappy[1]),
              started: false,
              done: false
            });
          });
        });

        S.forEach(function (s) {
          s.counts.forEach(function (c) {
            c.el.style.display = "inline-block";
            let maxW = 0;
            [c.txt, c.txt.replace(/\d/g, "8"), c.txt.replace(/\d/g, "0")].forEach(function (sample) {
              c.el.textContent = sample;
              maxW = Math.max(maxW, Math.ceil(c.el.offsetWidth));
            });
            c.el.textContent = c.txt;
            if (maxW > 0) c.el.style.minWidth = maxW + "px";
          });
        });

        thumbs = S.map(function (s, idx) {
          const tin = el("div", { className: "tin", "aria-hidden": "true" }, [
            buildThumbBgSvg(s, idx),
            buildThumbShapeEl(s)
          ]);
          const clone = s.el.cloneNode(true);
          clone.className = "slide in";
          tin.appendChild(clone);
          const btn = el(
            "button",
            {
              type: "button",
              className: "thumb",
              title: "Slide " + (idx + 1),
              "aria-label": "Slide " + (idx + 1)
            },
            [tin]
          );
          btn.addEventListener("click", function () { go(idx); });
          track.appendChild(btn);
          return btn;
        });

        S.forEach(resetSlide);

        document.getElementById("prev").addEventListener("click", function (e) {
          e.stopPropagation();
          go(cur - 1);
        });
        document.getElementById("next").addEventListener("click", function (e) {
          e.stopPropagation();
          go(cur + 1);
        });
        document.getElementById("tMot").addEventListener("click", function (e) {
          e.stopPropagation();
          setMotion(noMotion);
        });
        document.getElementById("tCar").addEventListener("click", function (e) {
          e.stopPropagation();
          toggleCarousel();
        });

        stage.addEventListener("click", function (e) {
          if (String(window.getSelection ? window.getSelection() : "").trim()) return;
          const jump = e.target.closest("[data-go]");
          if (jump) {
            e.preventDefault();
            go(Number(jump.dataset.go));
            return;
          }
          if (e.target.closest("a,button,input,select,textarea")) return;
          const rect = stage.getBoundingClientRect();
          if ((e.clientX - rect.left) / rect.width < 0.15) go(cur - 1);
          else go(cur + 1);
        });

        window.addEventListener("resize", syncCarousel);
        window.addEventListener("popstate", function () { go(readSlideIndex(), { snap: true }); });
        window.addEventListener("keydown", function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.target && e.target.closest && e.target.closest("input,select,textarea")) return;
          if ((e.key === "Enter" || e.key === " ") && e.target && e.target.closest && e.target.closest("a,button")) return;
          if (["ArrowRight", "PageDown", " ", "Enter"].indexOf(e.key) >= 0) {
            e.preventDefault();
            go(cur + 1);
          } else if (["ArrowLeft", "PageUp"].indexOf(e.key) >= 0) {
            e.preventDefault();
            go(cur - 1);
          } else if (e.key === "Home") {
            e.preventDefault();
            go(0);
          } else if (e.key === "End") {
            e.preventDefault();
            go(S.length - 1);
          } else if (e.key === "Escape" && dock.classList.contains("open")) {
            e.preventDefault();
            toggleCarousel();
          } else if (e.key === "c" || e.key === "C") {
            e.preventDefault();
            toggleCarousel();
          } else if (e.key === "m" || e.key === "M") {
            e.preventDefault();
            setMotion(noMotion);
          }
        });

        setMotion(!noMotion);
        go(readSlideIndex(), { snap: true, force: true });
        window.requestAnimationFrame(frame);
      }

      boot();
    })();
  </script>
</body>
</html>
