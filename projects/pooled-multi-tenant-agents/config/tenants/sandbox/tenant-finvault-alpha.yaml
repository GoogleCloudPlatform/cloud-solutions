tenant_id: tenant-finvault-alpha
display_name: FinVault Bank
tier: enterprise
org_unit: regulated-banking-us
identity:
  issuer: https://accounts.google.com
  provider: google
  role_claim: user_role
bigquery_row_policy_id: finvault_alpha_rap # legacy sandbox name (existing policy)
secret_ids: # Secret Manager secrets only this tenant's SA may read
  - cymbal-finvault-jira-credentials
cmek_key: finvault-alpha-cmek
authorized_scopes:
  - "2lo:cymbal.telemetry.read"
  - "2lo:cymbal.runbooks.read"
  - "2lo:cymbal.sandbox.execute"
  - "3lo:google.drive.readonly"
  - "3lo:google.calendar.events"
  - "3lo:google.gmail.send"
  - "3lo:jira.incidents.write"
  - "agent:cymbal_shared_diagnostic_agent"
  - "agent:finvault_regulatory_escalation_agent"
# SANDBOX: a synthetic customer-hosted MCP server (Hop 5 BYO). The gateway exchanges a context token
# for a 5-minute token with exactly this audience; the server verifies it against the JWKS.
external_mcp_audiences:
  - https://mcp.finvault.example/mcp
# Where this tenant runs: pool (shared, default) | silo | hybrid. See agents/topology_router.py.
topology:
  pattern: pool
