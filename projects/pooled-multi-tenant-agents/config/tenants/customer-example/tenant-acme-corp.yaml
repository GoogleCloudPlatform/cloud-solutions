# Minimal tenant: everything not listed comes from config/base.yaml (tier limits, default scopes).
tenant_id: tenant-acme-corp
display_name: Acme Corp
tier: standard
identity:
  issuer: https://acme.okta.com/oauth2/default
  provider: okta
  audience: 0oa-acme-agent-gateway # your Okta app's client ID
  role_claim: groups
  role_map: # Okta group -> platform role (required for customer data)
    acme-agent-admins: sre_admin
    acme-agent-compliance: compliance_officer
    acme-agent-analysts: read_only_analyst
cmek_key: tenant-acme-corp-cmek
# Optional. Default is the shared pool. For a dedicated silo or a hybrid PSC data plane:
# topology:
#   pattern: silo                 # pool | silo | hybrid
#   runtime_url: https://<silo runtime URL>
#   project_id: <silo project ID>
#   audience: https://<silo runtime URL>
#   # hybrid instead: data_endpoint (PSC, https), data_project_id, mcp_audience
