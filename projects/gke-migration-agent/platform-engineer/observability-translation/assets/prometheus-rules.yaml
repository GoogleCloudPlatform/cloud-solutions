apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: payments-rules
  namespace: payments
spec:
  groups:
    - name: payments.rules
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on payments-api"
