environment:
  resources:
    - type: gcp_project
      id: project_1
      variant: gcpfree
      allowed_locations:
        - us-central1
        - us-west1
        - us-west4
        - us-east1
        - us-east4
      startup_script:
        type: qwiklabs
        path: agentic-knowledge-catalog
      student_visible_outputs:
        - label: "Colab Runtime Template ID"
          reference: project_1.startup_script.colab_runtime_template_id
        - label: "Notebooks GCS Bucket"
          reference: project_1.startup_script.notebooks_gcs_bucket
        - label: "Colab Notebook 01 GCS URI (English)"
          reference: project_1.startup_script.notebook_01_gcs_uri
        - label: "Colab Notebook 01 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_01_gcs_uri_ko
        - label: "Colab Notebook 02 GCS URI (English)"
          reference: project_1.startup_script.notebook_02_gcs_uri
        - label: "Colab Notebook 02 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_02_gcs_uri_ko
        - label: "Colab Notebook 03 GCS URI (English)"
          reference: project_1.startup_script.notebook_03_gcs_uri
        - label: "Colab Notebook 03 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_03_gcs_uri_ko
        - label: "Colab Notebook 04 GCS URI (English)"
          reference: project_1.startup_script.notebook_04_gcs_uri
        - label: "Colab Notebook 04 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_04_gcs_uri_ko
        - label: "Colab Notebook 05 GCS URI (English)"
          reference: project_1.startup_script.notebook_05_gcs_uri
        - label: "Colab Notebook 05 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_05_gcs_uri_ko
        - label: "Colab Notebook 06 GCS URI (English)"
          reference: project_1.startup_script.notebook_06_gcs_uri
        - label: "Colab Notebook 06 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_06_gcs_uri_ko
        - label: "Colab Notebook 07 GCS URI (English)"
          reference: project_1.startup_script.notebook_07_gcs_uri
        - label: "Colab Notebook 07 GCS URI (Korean)"
          reference: project_1.startup_script.notebook_07_gcs_uri_ko
        - label: "BigQuery Dataset ID"
          reference: project_1.startup_script.bigquery_dataset_id
        - label: "VPC Network Name"
          reference: project_1.startup_script.vpc_name
        - label: "Google Cloud Project ID"
          reference: project_1.startup_script.gcp_project_id
        - label: "Google Cloud Region"
          reference: project_1.startup_script.gcp_region
