---
environment:
  resources:
    - type: gcp_project
      id: project_1
      variant: gcpfree
      allowed_locations:
        - us-central1
        - us-west1
        - us-west4
        - us-east1
        - us-east4
      startup_script:
        type: qwiklabs
        path: postgresql-to-alloydb
      student_visible_outputs:
        - label: "GCP Project ID"
          reference: project_1.startup_script.gcp_project_id
        - label: "GCP Region"
          reference: project_1.startup_script.gcp_region
        - label: "PostgreSQL VM Name"
          reference: project_1.startup_script.self_managed_postgres_vm_name
        - label: "PostgreSQL VM Internal IP"
          reference: project_1.startup_script.self_managed_postgres_vm_ip
