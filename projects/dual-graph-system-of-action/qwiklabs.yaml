---
entity_type: Lab
version: 2
default_locale: en
title:
  locales:
    en: "Dual-Graph System of Action: Autonomous Refund Agent Lab Guide"
    ko: "Dual-Graph System of Action: 자율 환불 에이전트 핸즈온 랩 가이드"
description:
  locales:
    en: "Explore and audit a Dual-Graph System of Action autonomous refund agent on Google Cloud using ADK 2.0, Cloud Spanner Graph, BigQuery Graph, Spanner Data Boost, and Knowledge Catalog."
    ko: "ADK 2.0, Cloud Spanner Graph, BigQuery Graph, Spanner Data Boost, Knowledge Catalog 기반의 Dual-Graph System of Action 자율 환불 에이전트를 실습하고 감사합니다."
instruction:
  type: markdown
  uri:
    locales:
      en: docs/QWIKLABS.md
      ko: docs/QWIKLABS_ko.md
duration: 60
max_duration: 90
credits: 0
level: intermediate
tags:
  - bigquery
  - spanner
  - vertex-ai
  - adk
environment:
  resources:
    - type: gcp_project
      id: project_0
      variant: gcpfree
      allowed_locations:
        - us-central1
        - us-west1
        - us-west4
        - us-east1
        - us-east4
      startup_script:
        type: Qwiklabs-Script
        path: .
        custom_properties:
          - key: spanner_instance_id
            value: "soa-graph-instance"
          - key: spanner_database_id
            value: "thelook-soa-db"
          - key: bigquery_dataset_id
            value: "soa_action_lineage"
          - key: adk_model_name
            value: "gemini-3-flash-preview"
          - key: max_refunds_100d_limit
            value: "10"
          - key: vip_max_refunds_100d_limit
            value: "20"
          - key: argolis
            value: "false"
          - key: enable_iap
            value: "false"
    - type: gcp_user
      id: user_0
      permissions:
        - project: project_0
          roles:
            - roles/viewer
            - roles/bigquery.connectionUser
            - roles/bigquery.jobUser
            - roles/bigquery.dataViewer
            - roles/spanner.databaseReaderWithDataBoost
            - roles/spanner.databaseUser
            - roles/dataplex.catalogViewer
            - roles/run.invoker
  student_visible_outputs:
    - label:
        locales:
          en: "TheLook Shopping Mall and Chat App URL (UI 1)"
      reference: project_0.startup_script.shopping_mall_url
    - label:
        locales:
          en: "Data Engineer Investigation Console URL (UI 2)"
      reference: project_0.startup_script.data_engineer_console_url
    - label:
        locales:
          en: "Cloud Spanner Instance ID"
      reference: project_0.startup_script.spanner_instance_id
    - label:
        locales:
          en: "Cloud Spanner Database ID"
      reference: project_0.startup_script.spanner_database_id
    - label:
        locales:
          en: "BigQuery Lineage Dataset ID"
      reference: project_0.startup_script.bigquery_dataset_id
    - label:
        locales:
          en: "BigQuery Spanner Data Boost Connection ID"
      reference: project_0.startup_script.spanner_connection_id
    - label:
        locales:
          en: "Google Cloud Project ID"
      reference: project_0.startup_script.gcp_project_id
    - label:
        locales:
          en: "Google Cloud Region"
      reference: project_0.startup_script.gcp_region
